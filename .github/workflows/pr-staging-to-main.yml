name: PR staging to main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  verify-staging-deployed:
    if: github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              environment: 'staging',
              per_page: 10,
            });

            if (deployments.length === 0) {
              throw new Error(
                `No staging deployment found for ${headSha}. ` +
                  'Merge to staging first and wait for "Deploy staging" to succeed.'
              );
            }

            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployments[0].id,
              per_page: 1,
            });

            const latest = statuses[0];
            if (!latest || latest.state !== 'success') {
              throw new Error(
                `Staging deployment for ${headSha} is not successful ` +
                  `(state: ${latest?.state ?? 'none'}).`
              );
            }

            core.info(`Staging deployment verified for ${headSha}.`);
