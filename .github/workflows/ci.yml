name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: tdtd-node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdtd-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tdtd-node/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    name: tdtd-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdtd-frontend
    env:
      VITE_API_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tdtd-frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  batch:
    name: tdtd-batch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdtd-batch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: mvn -B package
