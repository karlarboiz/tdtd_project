services:
  api:
    build:
      context: ..
      dockerfile: tdtd-node/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      TDTD_DB_PATH: /data/teacher_app.sqlite
      TDTD_REPORT_OUTPUT_DIR: /data/reports
    volumes:
      - tdtd_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  batch:
    build:
      context: ../tdtd-batch
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TDTD_DB_PATH: /data/teacher_app.sqlite
    volumes:
      - tdtd_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    profiles: [backup]
    image: alpine:3.21
    env_file:
      - .env
    environment:
      TDTD_DB_PATH: /data/teacher_app.sqlite
      TDTD_BACKUP_DIR: /data/backups
    volumes:
      - tdtd_data:/data
      - ../scripts/backup-sqlite.sh:/usr/local/bin/backup-sqlite.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-sqlite.sh"]

volumes:
  tdtd_data:
  caddy_data:
  caddy_config:
